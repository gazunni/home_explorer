name: Validate Home Explorer
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install websockets
      - run: python -m py_compile home_explorer/server.py home_explorer/tests/test_discovery.py
      - run: node --check home_explorer/web/app.js
      - run: node home_explorer/tests/test_dependency_ui.cjs
      - run: node home_explorer/tests/test_opportunities.cjs
      - name: Check version consistency
        run: |
          python - <<'PY'
          from pathlib import Path
          config = Path('home_explorer/config.yaml').read_text()
          version = next(line.split(':', 1)[1].strip() for line in config.splitlines() if line.startswith('version:'))
          parts = [
              ('home_explorer/Dockerfile', 'io.hass.version="' + version + '"'),
              ('home_explorer/web/index.html', 'v' + version),
              ('home_explorer/server.py', "'version': '" + version + "'"),
              ('README.md', 'Current version: **' + version + '**'),
              ('home_explorer/CHANGELOG.md', '## [' + version + ']'),
          ]
          for filename, needle in parts:
              assert needle in Path(filename).read_text(), filename + ' version mismatch'
          print('Version consistent: ' + version)
          PY

      - name: Verify dual architecture metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          config = Path('home_explorer/config.yaml').read_text()
          docker = Path('home_explorer/Dockerfile').read_text()
          assert '  - aarch64' in config and '  - amd64' in config
          assert 'aarch64|amd64' in docker
          assert 'stage: experimental' in config
          print('Both architectures declared; stage remains experimental')
          PY
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ARM64 image without publishing
        run: docker buildx build --platform linux/arm64 --progress=plain home_explorer
      - run: docker build --platform linux/amd64 -t home-explorer-ci home_explorer
      - run: |
          docker run -d --name home-explorer-smoke -p 18099:8099 home-explorer-ci
          sleep 4
          docker ps --filter name=home-explorer-smoke --filter status=running --format '{{.Names}}' | grep -qx home-explorer-smoke
          docker exec home-explorer-smoke sh -c "ps -o user,comm | grep -E '^explorer[[:space:]]+python' "
          docker exec home-explorer-smoke su explorer -c 'touch /data/explorer-smoke && rm /data/explorer-smoke'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18099/api/devices)" = "403"
          docker logs home-explorer-smoke
          docker rm -f home-explorer-smoke
      - run: PYTHONPATH=home_explorer python -m unittest discover -s home_explorer/tests -v
