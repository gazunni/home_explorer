name: Validate Home Explorer
on:
  push:
    branches: [home-explorer-v0-2-0-discovery, main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python -m py_compile home_explorer/server.py home_explorer/tests/test_discovery.py
      - name: Run offline privacy tests
        run: cd home_explorer && python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: node --check home_explorer/web/app.js
      - name: Validate config YAML
        run: |
          python -m pip install --quiet PyYAML
          python - <<'PY'
          import yaml
          from pathlib import Path
          data = yaml.safe_load(Path("home_explorer/config.yaml").read_text())
          assert data["version"] == "0.2.0"
          assert data["ingress"] is True
          assert data["protected"] is True
          assert data["boot"] == "manual"
          assert data["host_network"] is False
          PY
