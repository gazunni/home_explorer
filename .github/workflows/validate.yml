name: Validate Home Explorer
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install websockets
      - run: python -m py_compile home_explorer/server.py home_explorer/tests/test_discovery.py
      - run: node --check home_explorer/web/app.js
      - run: sh -n home_explorer/entrypoint.sh
      - run: docker build -t home-explorer-ci home_explorer
      - run: PYTHONPATH=home_explorer python -m unittest discover -s home_explorer/tests -v
